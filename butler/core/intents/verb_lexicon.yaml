# Butler 动词识别同义词典 (P1)
# ---------------------------------------------------------------------------
# 用途: 把同义表述归一到规范意图, 供 butler/core/verb_engine.py 使用。
#   verbs / objects 命中即得分 (规则通道), examples 供语义通道比对。
#   新增能力 = 在此追加条目, 无需改代码。
# 得分: 动词命中 0.55 + 宾语命中 0.45; 双命中→1.0 (自动执行),
#       单命中→0.55/0.45 (需确认或交 AI), 语义通道取示例句最大相似度。
# destructive: true 的意图必须显式说"确认/确定"才执行。
# ---------------------------------------------------------------------------

actions:
  screen.capture:
    label: 截取画面
    verbs: [记录, 截取, 截屏, 截图, 拍下, 拍照, 留档, 抓取, 来张, 来一张, 存下, 截]
    objects: [画面, 屏幕, 眼前画面, 显示器, 当前界面, 桌面, 屏幕内容, 截屏, 截图, 屏, 图像]
    examples:
      - 记录当前画面
      - 记录当前眼前画面
      - 截个屏
      - 帮我截一下屏幕
      - 屏幕留个档
      - 来张截图
      - 拍一下当前界面
      - 记录当前窗口
      - 截一下活动窗口
      - 帮我截取指定区域
    slots: [scope, path]

  textfile.edit:
    label: 文本文档编辑
    verbs: [编辑, 修改, 改写, 润色, 编写, 调整, 修订]
    objects: [文本文档, 文本文件, 文档, 记事本, txt, 文字文件, 文件内容, 稿子, 稿件]
    examples:
      - 编辑文本文档
      - 修改一下这个文本文件
      - 把文档润色一下
      - 帮我编写一份文档
    slots: [path, content]

  file.move:
    label: 移动文件
    verbs: [移动, 挪, 转移, 搬]
    objects: [文件, 文件夹, 文本文档, 文档, 目录, 资料]
    examples:
      - 把这个文件移动到下载目录
      - 挪一下这个文档
      - 把资料转移到 D 盘
    slots: [path, target]

  file.copy:
    label: 复制文件
    verbs: [复制, 拷贝, 备份]
    objects: [文件, 文件夹, 文本文档, 文档, 目录, 资料]
    examples:
      - 复制这个文件到桌面
      - 把文档备份一份
    slots: [path, target]

  file.rename:
    label: 重命名
    verbs: [重命名, 改名, 换名]
    objects: [文件, 文件夹, 文档, 目录]
    examples:
      - 给这个文件改名
      - 把文件夹重命名一下
    slots: [path, name]

  file.delete:
    label: 删除文件
    verbs: [删除, 删掉, 移除, 清掉]
    objects: [文件, 文件夹, 文档, 目录, 资料]
    examples:
      - 删除这个文件
      - 把这个文件夹删掉
    slots: [path]
    destructive: true

  topic.recall:
    label: 回到话题
    verbs: [回到, 恢复, 说回, 聊回, 接回, 继续]
    objects: [话题, 刚才, 之前, 上一个, 前面, 上次]
    examples:
      - 回到刚才的话题
      - 我们说回之前那个话题
      - 继续刚才聊的那个
    slots: [query]

  topic.list:
    label: 话题列表
    verbs: [列出, 看看, 显示, 查看, 哪些]
    objects: [话题, 话题列表, 聊过]
    examples:
      - 我们聊过哪些话题
      - 显示话题列表
    slots: []

  topic.save:
    label: 话题存档
    verbs: [存档, 挂起, 收起来, 先放一放]
    objects: [话题]
    examples:
      - 把这个话题先存档
      - 当前话题挂起一下
    slots: []

  topic.switch:
    label: 切换新话题
    verbs: [换个话题, 换话题, 新话题, 开始新话题, 说点别的, 聊点别的]
    objects: [话题, 新的]
    examples:
      - 我们换个话题吧
      - 开始一个新话题
    slots: [query]

# 槽位词表: 范围修饰 (screen.capture 的 scope)
scopes:
  fullscreen: [全屏, 整个屏幕, 整屏, 全画面, 当前画面, 当前屏幕, 当前眼前画面, 眼前画面]
  region: [区域, 一块, 框选, 一部分, 选区, 指定区域]
  window: [当前窗口, 这个窗口, 活动窗口, 前台窗口]

# 复合句连接词: 命中则拆分为多条指令 (截屏并保存到桌面 → 2 条)
connectors: [然后, 接着, 之后, 随后, 并且, 同时, 顺手]
