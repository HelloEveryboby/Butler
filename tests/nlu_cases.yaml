# 动词识别评测集 (tests/test_verb_engine.py 自动加载)
# 目标: 同义表述归一准确率 ≥ 95%
# 字段: text=用户原话 | intent=期望规范意图 | scope=期望范围槽位(可选) | no_match=期望无匹配(可选)

# --- screen.capture: 同义表述全家福 ---
- text: '记录当前画面'
  intent: screen.capture
  scope: fullscreen
- text: '记录当前眼前画面'
  intent: screen.capture
  scope: fullscreen
- text: '截个屏'
  intent: screen.capture
  scope: fullscreen
- text: '帮我截一下屏幕'
  intent: screen.capture
  scope: fullscreen
- text: '屏幕留个档'
  intent: screen.capture
  scope: fullscreen
- text: '来张截图'
  intent: screen.capture
  scope: fullscreen
- text: '拍一下当前界面'
  intent: screen.capture
  scope: fullscreen
- text: '截图'
  intent: screen.capture
  scope: fullscreen
- text: '抓取全屏画面'
  intent: screen.capture
  scope: fullscreen
- text: '帮我拍下显示器画面'
  intent: screen.capture
  scope: fullscreen
- text: '把屏幕内容存下来'
  intent: screen.capture
  scope: fullscreen
- text: '来一张屏幕截图'
  intent: screen.capture
  scope: fullscreen
- text: '记录当前窗口'
  intent: screen.capture
  scope: window
- text: '截一下活动窗口'
  intent: screen.capture
  scope: window
- text: '框选区域截图'
  intent: screen.capture
  scope: region
- text: '帮我截取指定区域'
  intent: screen.capture
  scope: region

