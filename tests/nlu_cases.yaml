  intent: file.delete

# --- topic.* ---
- text: '回到刚才的话题'
  intent: topic.recall
- text: '我们说回之前那个话题'
  intent: topic.recall
- text: '继续刚才聊的那个'
  intent: topic.recall
- text: '我们聊过哪些话题'
  intent: topic.list
- text: '显示话题列表'
  intent: topic.list
- text: '把这个话题先存档'
  intent: topic.save
- text: '当前话题挂起一下'
  intent: topic.save
- text: '我们换个话题吧'
  intent: topic.switch
- text: '开始一个新话题'
  intent: topic.switch

# --- 复合句: 拆分后全部命中 ---
- text: '截个屏，然后记录当前画面'
  intent: screen.capture
  count: 2

# --- 干扰样本: 不应命中任何动词意图 ---
- text: '帮我排序 [3, 1, 4]'
  no_match: true
- text: "打开程序 'Notepad'"
  no_match: true
- text: '今天天气怎么样'
  no_match: true
- text: '介绍一下你自己'
  no_match: true
- text: '帮我写一段 Python 代码'
  no_match: true
