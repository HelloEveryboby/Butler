<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butler Flash Input</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: var(--font-family, 'Inter', sans-serif);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>
<body class="theme-apple">
    <div class="flash-container">
        <canvas id="voice-canvas" class="voice-canvas-overlay"></canvas>
        <button id="mic-toggle" class="mic-button" title="点击开始/停止语音控制">
            <i class="fas fa-microphone"></i>
        </button>
        <input type="text" id="main-input" class="input-box" placeholder="记录灵感、执行命令或按说出指令..." autofocus>
        <span id="voice-status" class="voice-status-badge">就绪</span>
        <div class="hint">按下 <b>Enter</b> 发送 | <b>Esc</b> 退出 | 支持唤醒词“贾维斯/Butler”</div>
    </div>

    <!-- Single Bundled Production Script -->
    <script src="dist/bundle.js"></script>
</body>
</html>
