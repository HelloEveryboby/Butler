<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butler Flash Input</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="src/win11.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: var(--font-family, 'Segoe UI', 'Microsoft YaHei', sans-serif);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>
<body class="theme-win11">
    <div class="flash-container">
        <canvas id="voice-canvas" class="voice-canvas-overlay"></canvas>
        <button id="mic-toggle" class="mic-button" title="点击开始/停止语音控制">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5.4" y="1.8" width="5.2" height="8" rx="2.6"/>
                <path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2M5.8 14.2h4.4"/>
            </svg>
        </button>
        <input type="text" id="main-input" class="input-box" placeholder="输入指令或记录灵感..." autofocus>
        <span id="voice-status" class="voice-status-badge">就绪</span>
        <div class="hint">Enter 发送 · Esc 退出 · 支持唤醒词“贾维斯 / Butler”</div>
    </div>

    <!-- Win11 Flash Input Bundle -->
    <script src="dist/flash.js"></script>
</body>
</html>
