<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Butler 翻译">
  <!-- Butler 翻译 PWA 图标（内联 SVG，无外部图片资源） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- 译 -->
  <text x="256" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"
        font-size="270" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">译</text>
  <!-- 底部双语条 -->
  <rect x="128" y="392" width="256" height="26" rx="13" fill="#ffffff" opacity="0.55"/>
  <rect x="128" y="432" width="168" height="26" rx="13" fill="#ffffff" opacity="0.35"/>
</svg>
