  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="268" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"
        font-size="216" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">译</text>
  <rect x="176" y="352" width="160" height="20" rx="10" fill="#ffffff" opacity="0.55"/>
