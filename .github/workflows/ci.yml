name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Quality Tools
        run: pip install ruff mypy

      - name: Run Ruff Linter
        run: ruff check butler/ tests/

      - name: Run Ruff Format Check
        run: ruff format --check butler/ tests/

      - name: Run MyPy Type Checker (new modules)
        run: mypy butler/core/container.py butler/core/config_model.py butler/core/capability_reporter.py butler/core/code_sandbox.py butler/core/intent_dispatcher.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-cov pytest-asyncio pypdf

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest tests/unit/ -v --tb=short --cov=butler --cov-report=term-missing

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t butler:latest .
