[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Butler"
version = "2.0.0"
description = "一种基于Python的高级智能助手系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PAYDAY3", email = "error123456ew@outlook.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech"
]
dependencies = [
    # default install includes core + office + llm
    "Flask",
    "requests>=2.32.0",
    "python-dotenv",
    "PyYAML",
    "psutil",
    "watchdog",
    "schedule",
    "tabulate",
    "tqdm",
    "chardet",
    "beautifulsoup4",
    "markdownify",
    "lxml",
    "defusedxml",
    "openpyxl",
    "python-docx",
    "python-pptx",
    "pypdf",
    "pdfplumber",
    "ebooklib",
    "rtf-converter",
    "reportlab",
    "openai",
    "anthropic",
    "deepseek",
    "instructor",
    "textual",
    "rich",
    "pygments",
]

[project.optional-dependencies]
core = [
    "Flask",
    "requests>=2.32.0",
    "python-dotenv",
