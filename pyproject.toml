[project.urls]
Homepage = "https://github.com/HelloEveryboby/Butler"
Documentation = "https://github.com/HelloEveryboby/Butler/wiki"
Source = "https://github.com/HelloEveryboby/Butler"
Tracker = "https://github.com/HelloEveryboby/Butler/issues"

[project.scripts]
butler = "butler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["butler*", "package*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["butler"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "verification"]
addopts = "-ra --tb=short"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["butler"]
omit = ["*/tests/*", "*/verification/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
