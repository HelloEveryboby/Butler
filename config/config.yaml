# Butler 智能管家系统配置文件

api:
  # ============================================
  # AI 模型提供商配置
  # ============================================
  # 提供商: deepseek | openai | zhipu | anthropic | gemini | dashscope | qianfan | custom
  provider: "${AI_PROVIDER:-deepseek}"
  # 自定义提供商名称 (custom 时用于区分多个自定义配置)
  provider_label: "${CUSTOM_PROVIDER_NAME:-}"
  # API 基础地址 (留空使用提供商默认)
  base_url: "${API_BASE_URL:-}"
  # 模型名称 (留空使用提供商默认)
  model_name: "${MODEL_NAME:-}"

  # ============================================
  # API 密钥配置 (仅需填写当前 provider 对应的密钥)
  # ============================================
  # DeepSeek API 密钥
  deepseek_key: "${DEEPSEEK_API_KEY:-}"
  # OpenAI API 密钥
  openai_key: "${OPENAI_API_KEY:-}"
  # 智谱 AI API 密钥
  zhipu_key: "${ZHIPU_API_KEY:-}"
  # Anthropic Claude API 密钥
  anthropic_key: "${ANTHROPIC_API_KEY:-}"
  # Google Gemini API 密钥
  gemini_key: "${GEMINI_API_KEY:-}"
  # 通义千问 (DashScope) API 密钥
  dashscope_key: "${DASHSCOPE_API_KEY:-}"
  # 百度文心一言 (千帆) API 密钥
  qianfan_key: "${QIANFAN_API_KEY:-}"
  # 自定义 API 密钥
  custom_key: "${CUSTOM_API_KEY:-}"

  # 百度语音 API 配置
  baidu_app_id: "${BAIDU_APP_ID:-}"
  baidu_api_key: "${BAIDU_API_KEY:-}"
  baidu_secret_key: "${BAIDU_SECRET_KEY:-}"
  # Picovoice 访问密钥
  picovoice_access_key: "${PICOVOICE_ACCESS_KEY:-}"
  quota:
    consumed: 0.0002

voice:
  # 语音引擎模式:
  #   auto    - 自动选择（按可用性降级）
  #   native  - 操作系统原生语音 (Windows SAPI / macOS / Linux)
  #   local   - 本地模型 Faster-Whisper（离线）
  #   baidu   - 百度语音 API（在线）
  #   google  - Google Cloud Speech API（在线）
  #   azure   - Microsoft Azure Speech（在线）
  #   text    - 纯文本（关闭语音）
  # 兼容旧值: system→native, online→baidu
  mode: "auto"
  # 本地 Whisper 模型大小: tiny / base / small / medium / large
  local_stt_model: "base"
  # 朗读 TTS 后端: edge（神经音色，需联网）| native（系统 pyttsx3，离线兜底）
  tts_backend: "edge"

# 小说朗读
reading:
  backend: "edge"
  female_voices:
    - "zh-CN-XiaoxiaoNeural"
    - "zh-CN-XiaoyiNeural"
    - "zh-CN-XiaohanNeural"
  male_voices:
    - "zh-CN-YunxiNeural"
    - "zh-CN-YunyangNeural"
    - "zh-CN-YunjianNeural"
  narrator_voice: "zh-CN-XiaoxiaoNeural"
  default_rate: 1.0
  ai_analysis: false   # true 时允许调用 LLM 推断角色/情绪（消耗 token）

# 文档扫描
scanner:
  default_mode: "color"   # color | gray | bw | pencil | charcoal
  keep_ink: true          # 保留彩色笔勾画
  pdf_dpi: 200
  ocr_backend: "auto"     # auto | paddle | tesseract

# Git 式版本管理
versioning:
  enabled: true
  text_backend: "auto"    # auto（在仓库内就地提交，否则影子仓）| shadow
  max_artifact_mb: 512
  prune_keep: 50

# dsh 插件市场适配
dsh:
  market_index_urls: []
  auto_register_commands: true
  allow_hooks: false      # 安全边界：默认不执行插件 hooks

# 命令记录器
commands:
  auto_record: true
  promote_min_count: 5

persona:
  emotional_mode: true

display:
  default_mode: "host"
  theme: "google"
  usb_screen:
    width: 40
    height: 8

performance:
  # 模式: NORMAL, ECO, HIGH_PERFORMANCE
  mode: "NORMAL"

interpreter:
  safety_mode: true
  max_iterations: 10

dream:
  # Dream: 递归自我改进（发现历史回放模拟器 + 做梦策略优化）
  # 只修订探索策略；discovery agent / evaluator 保持固定（论文 §3）
  enabled: true
  data_dir: "data/dream"
  K1: 10          # 单次在线 rollout 最大决策轮数
  W: 4            # 并行 worker 数（决策批次上限）
  K2: 10          # 回放最大决策轮数
  M: 3            # 每次做梦评估的策略版本数（含当前策略，保证不退化）
  beta1: 0.1      # 执行代价惩罚系数
  beta2: 0.1      # 并行度奖励系数
  dream_every: 1  # 每隔多少个在线轮次触发一次做梦
  seed: 0

runner_server:
  host: "127.0.0.1"
  port: 8000
  token: "YOUR_RUNNER_SERVER_TOKEN_HERE"

# 自动资源下载与更新配置
update_source:
  assets_base_url: "https://raw.githubusercontent.com/HelloEveryboby/Butler/main/"
  api_latest_release: "https://api.github.com/repos/HelloEveryboby/Butler/releases/latest"
  python_runtime_urls:
    Windows: "https://www.python.org/ftp/python/3.12.3/python-3.12.3-embed-amd64.zip"
    Linux: "https://github.com/indygreg/python-build-standalone/releases/download/20240415/cpython-3.12.3+20240415-x86_64-unknown-linux-gnu-install_only.tar.gz"
    Darwin: "https://github.com/indygreg/python-build-standalone/releases/download/20240415/cpython-3.12.3+20240415-x86_64-apple-darwin-install_only.tar.gz"

# 原生 Agent 运行时（LLM 原生 tool calling 循环）
agent:
  runtime: true            # 聊天主路径使用 AgentRuntime（失败时自动回退旧流程）
  max_turns: 25            # 单任务最大轮次
  max_skill_tools: 40      # 注册为工具的技能上限（0 = 不限制）
  permission_mode: default # default | accept_edits | auto | plan | bypass_permissions
  auto_confirm: true       # 无 UI 时自动批准非只读工具（自毁命令始终拒绝）
  expose_intents: false    # 额外暴露意图处理器为工具
  memory: true             # 任务经验自动沉淀 / 召回
  memory_limit: 3          # 每次召回的历史经验条数
  # memory_file: butler/data/butler_memory/MEMORY.md
  scheduler_autostart: false  # 启动时运行主动代理调度器（butler agent schedule）

# MCP 工具服务器（stdio）：配置后 Agent 自动获得 mcp_<server>_<tool> 工具
mcp:
  servers: []
  # - name: filesystem
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/root/workspace"]
