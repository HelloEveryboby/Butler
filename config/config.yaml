# Butler 智能管家系统配置文件

api:
  # ============================================
  # AI 模型提供商配置
  # ============================================
  # 提供商: deepseek | openai | zhipu | anthropic | gemini | dashscope | qianfan | custom
  provider: "${AI_PROVIDER:-deepseek}"
  # 自定义提供商名称 (custom 时用于区分多个自定义配置)
  provider_label: "${CUSTOM_PROVIDER_NAME:-}"
  # API 基础地址 (留空使用提供商默认)
  base_url: "${API_BASE_URL:-}"
  # 模型名称 (留空使用提供商默认)
  model_name: "${MODEL_NAME:-}"

  # ============================================
  # API 密钥配置 (仅需填写当前 provider 对应的密钥)
  # ============================================
  # DeepSeek API 密钥
  deepseek_key: "${DEEPSEEK_API_KEY:-}"
  # OpenAI API 密钥
  openai_key: "${OPENAI_API_KEY:-}"
  # 智谱 AI API 密钥
  zhipu_key: "${ZHIPU_API_KEY:-}"
  # Anthropic Claude API 密钥
  anthropic_key: "${ANTHROPIC_API_KEY:-}"
  # Google Gemini API 密钥
  gemini_key: "${GEMINI_API_KEY:-}"
  # 通义千问 (DashScope) API 密钥
  dashscope_key: "${DASHSCOPE_API_KEY:-}"
  # 百度文心一言 (千帆) API 密钥
  qianfan_key: "${QIANFAN_API_KEY:-}"
  # 自定义 API 密钥
  custom_key: "${CUSTOM_API_KEY:-}"

  # 百度语音 API 配置
  baidu_app_id: "${BAIDU_APP_ID:-}"
  baidu_api_key: "${BAIDU_API_KEY:-}"
  baidu_secret_key: "${BAIDU_SECRET_KEY:-}"
  # Picovoice 访问密钥
  picovoice_access_key: "${PICOVOICE_ACCESS_KEY:-}"
  quota:
    consumed: 0.0002

voice:
  # 模式: online (百度), local (Faster-Whisper), offline
  mode: "online"
  local_stt_model: "base"

persona:
  emotional_mode: true

display:
  default_mode: "host"
  theme: "google"
  usb_screen:
    width: 40
    height: 8

performance:
  # 模式: NORMAL, ECO, HIGH_PERFORMANCE
  mode: "NORMAL"

interpreter:
  safety_mode: true
  max_iterations: 10

runner_server:
  host: "127.0.0.1"
  port: 8000
  token: "YOUR_RUNNER_SERVER_TOKEN_HERE"

# 自动资源下载与更新配置
update_source:
  assets_base_url: "https://raw.githubusercontent.com/HelloEveryboby/Butler/main/"
  api_latest_release: "https://api.github.com/repos/HelloEveryboby/Butler/releases/latest"
  python_runtime_urls:
    Windows: "https://www.python.org/ftp/python/3.12.3/python-3.12.3-embed-amd64.zip"
    Linux: "https://github.com/indygreg/python-build-standalone/releases/download/20240415/cpython-3.12.3+20240415-x86_64-unknown-linux-gnu-install_only.tar.gz"
    Darwin: "https://github.com/indygreg/python-build-standalone/releases/download/20240415/cpython-3.12.3+20240415-x86_64-apple-darwin-install_only.tar.gz"
